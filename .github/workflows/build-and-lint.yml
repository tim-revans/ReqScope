name: Build & Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Install Dependancies
        run: npm ci
      
      - name: Build
        run: npm run build --if-present

      - name: Test
        run: xvfb-run -a npm test
