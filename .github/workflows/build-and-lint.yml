name: Build & Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run build --if-present
      - run: xvfb-run -a npm test
      - run: npm run package-dry
